<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testimonials | Bible Talk with Judah</title>
    <meta name="description" content="Read what attendees say about Bible Talk with Judah's interactive Bible discussions on Romans and Hebrews." />
    <link rel="canonical" href="https://bibletalkwithjudah.vercel.app/testimonials.html" />

    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bible Talk with Judah" />
    <meta property="og:title" content="Testimonials | Bible Talk with Judah" />
    <meta property="og:description" content="Read what attendees say about Bible Talk with Judah's interactive Bible discussions on Romans and Hebrews." />
    <meta property="og:url" content="https://bibletalkwithjudah.vercel.app/testimonials.html" />
    <meta property="og:image" content="https://bibletalkwithjudah.vercel.app/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bible Talk with Judah logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <link href="./assets/css/tailwind.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />

    <style>
      h1 {
        font-size: 20vh;
        font-family: "Unbounded", sans-serif;
      }
      span,
      h2 {
        font-family: "Unbounded", sans-serif;
      }
      @keyframes marquee {
        0% {
          transform: translateX(0%);
        }
        100% {
          transform: translateX(-100%);
        }
      }
      .animate-loop-scroll {
        animation: marquee 30s linear infinite;
      }
      .image-panel {
        background-size: cover;
        background-position: center;
      }
      .lifestyle-image {
        background-image: url("https://via.placeholder.com/1000x1500/000000/FFFFFF?text=LIFESTYLE+IMAGE");
      }
      .avatar-active {
        box-shadow: 0 0 0 4px #ffffff;
        border: 2px solid #8b5cf6;
      }
      .hero-bg {
        background-color: #0b1c2b;
      }
      /* Custom styling for the abstract green/purple element in the background */
      .abstract-bg {
        /* Using a placeholder image for the abstract shapes */
        background-image: url("./abstract.jpg");
        background-size: cover;
        background-position: center;
      }
      .contanct-us {
        background-image: url("./contactus.jpg");
        background-size: cover;
        background-position: center;
      }
      /* Custom styles for Pure Black Mode */
      .testimonial-card {
        box-shadow: 0 10px 15px -3px rgba(255, 255, 255, 0.1),
          0 4px 6px -2px rgba(255, 255, 255, 0.05); /* White shadow for contrast */
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .testimonial-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(255, 255, 255, 0.15),
          0 10px 10px -5px rgba(255, 255, 255, 0.08);
      }

      /* Every card shows the same number of lines; longer quotes are cut off
         with an ellipsis and can be read in full in the dialog */
      .testimonial-text {
        line-height: 1.625;
        height: calc(1.625em * 6);
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 6;
        line-clamp: 6;
        overflow: hidden;
      }
      .testimonial-card.is-truncated {
        cursor: pointer;
      }
      .testimonial-dialog {
        width: min(42rem, calc(100% - 2rem));
        max-height: calc(100% - 2rem);
        overflow-y: auto;
        padding: 0;
        border: 1px solid #374151; /* gray-700 */
        border-radius: 0.75rem;
        background-color: #000;
        color: #fff;
      }
      .testimonial-dialog::backdrop {
        background-color: rgba(0, 0, 0, 0.8);
      }
      body:has(.testimonial-dialog[open]) {
        overflow: hidden;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body class="bg-black text-white">
    <nav class="w-full">
      <div
        class="bg-white px-5 py-3 shadow-md shadow-purple-200/50 rounded-md flex flex-row justify-between items-center"
      >
        <a href="./index.html" class="shrink-0"
          ><img src="./assets/logo/logo-dark.svg" alt="Bible Talk with Judah" width="304" height="96" class="h-10 md:h-12 w-auto" /></a
        >

        <ul class="flex gap-4 md:text-xl font-medium text-gray-800">
          <li><a href="./gallery.html">Gallery</a></li>
        </ul>
      </div>
    </nav>

    <section class="py-16 md:py-24 px-4 sm:px-6 lg:px-8">
      <div class="max-w-6xl mx-auto">
        <h1
          class="text-3xl md:text-5xl font-extrabold text-center tracking-tight text-white mb-12 md:mb-16 leading-tight"
        >
          Trusted by attendees and <br />
          those who have grown
        </h1>

        <div
          id="testimonials-grid"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8"
        ></div>
      </div>
    </section>
    <dialog
      id="testimonial-dialog"
      class="testimonial-dialog"
      aria-labelledby="testimonial-dialog-author"
    >
      <div class="relative p-6 md:p-10 animate__animated animate__fadeIn animate__faster">
        <button
          type="button"
          class="dialog-close absolute top-3 right-4 text-3xl leading-none text-gray-400 hover:text-white"
          aria-label="Close"
        >
          &times;
        </button>
        <p
          id="testimonial-dialog-text"
          class="text-white text-lg leading-relaxed italic mt-4"
        ></p>
        <p id="testimonial-dialog-author" class="font-semibold text-white mt-6"></p>
      </div>
    </dialog>
    <hr>
     <footer class=" text-center py-6 mt-auto shadow-inner shadow-purple-200 rounded-t-md flex flex-col items-center gap-3">
      <a href="./index.html"><img src="./assets/logo/logo-light.svg" alt="Bible Talk with Judah" width="304" height="96" loading="lazy" class="h-12 w-auto" /></a>
      <span class="text-sm text-gray-400">&copy; 2025 Bible Talk with Judah. </span>
    </footer>  
    <script>
      const testimonials = [
        {
          text: "I was privileged and very honored to attend the Bible discussions on Romans and Hebrews. It was such an eye-opening experience. The sessions didn’t just go through scripture; they created space for reflection, real conversations, and practical takeaways that I could apply to everyday life. I found myself growing both in understanding and in faith, and the group dynamic made learning enjoyable and meaningful. I would absolutely recommend these discussions to anyone who wants to deepen their relationship with God and explore the Bible in a more interactive way.",
          author: "Eva - 🇰🇪",
          imageUrl: "https://randomuser.me/api/portraits/women/44.jpg",
        },
        {
          text: "I would like to appreciate Judah for taking the effort to teach us Romans & Hebrews. What I knew God & my thoughts about God & His people has completely changed. I am more relaxed now knowing God is in Control & I understand deeply the sacrifice that Jesus made on the cross for me. I would recommend others to attend these bible studies as it helps us learn & understand the word of God better.",
          author: "Beula - 🇮🇳",
          imageUrl: "https://randomuser.me/api/portraits/women/65.jpg",
        },
        {
          text: "I had the privilege of joining a deep Bible discussion on the books of Romans and Hebrews led by Judah, and it was truly one of the best Bible studies I’ve ever been part of. The teaching was both eye-opening and thought-provoking, shifting my perspective and transforming the way I approach my own Bible study. I would wholeheartedly recommend it to anyone who wants to grow deeper in the Word and strengthen their biblical understanding.",
          author: "Hanna - 🇪🇹",
          imageUrl: "https://randomuser.me/api/portraits/men/76.jpg",
        },
        {
          text: "What better treasure than to gather around than God’s Word?In a world consumed with gossip and empty chatter, Bible Talk with Judah offers platforms for people to have edifying conversations around God's Word.",
          author: "Samuel - 🇳🇬",
          imageUrl: "https://randomuser.me/api/portraits/men/32.jpg",
        },
      ];

      const grid = document.getElementById("testimonials-grid");
      const dialog = document.getElementById("testimonial-dialog");

      // Show "Read more" only on cards whose quote doesn't fit in the clamped lines
      function updateTruncation() {
        grid.querySelectorAll(".testimonial-card").forEach((card) => {
          const text = card.querySelector(".testimonial-text");
          const truncated = text.scrollHeight > text.clientHeight + 1;
          card.classList.toggle("is-truncated", truncated);
          card.querySelector(".read-more").classList.toggle("invisible", !truncated);
        });
      }

      function openTestimonial(index) {
        const testimonial = testimonials[index];
        document.getElementById("testimonial-dialog-text").textContent = `"${testimonial.text}"`;
        document.getElementById("testimonial-dialog-author").textContent = testimonial.author;
        dialog.showModal();
      }

      // JavaScript to render the testimonials with sequential animation
      document.addEventListener("DOMContentLoaded", () => {
        testimonials.forEach((testimonial, index) => {
          // Calculate delay: 0.2s for the first card, 0.4s for the second, 0.6s for the third, etc.
          const delay = (index + 1) * 200;

          const cardHtml = `
                    <div class="testimonial-card bg-black p-6 rounded-xl border border-gray-700 flex flex-col h-full
                        animate__animated animate__fadeInUp"
                        style="animation-delay: ${delay}ms;"
                        data-index="${index}">
                        <p class="testimonial-text text-white italic">
                            "${testimonial.text}"
                        </p>
                        <button type="button"
                            class="read-more invisible self-start mt-3 text-sm font-semibold text-purple-400 hover:text-purple-300"
                            aria-label="Read the full testimonial from ${testimonial.author}">
                            Read more
                        </button>
                        <p class="font-semibold text-white mt-auto pt-6">${testimonial.author}</p>
                    </div>
                `;
          grid.insertAdjacentHTML("beforeend", cardHtml);
        });

        // Re-check on resize, since the number of lines depends on the card width
        new ResizeObserver(updateTruncation).observe(grid);

        grid.addEventListener("click", (event) => {
          const card = event.target.closest(".testimonial-card.is-truncated");
          if (card) openTestimonial(card.dataset.index);
        });

        dialog.querySelector(".dialog-close").addEventListener("click", () => dialog.close());
        dialog.addEventListener("click", (event) => {
          // A click on the backdrop lands on the <dialog> itself
          if (event.target === dialog) dialog.close();
        });
      });
    </script>
  </body>
</html>
